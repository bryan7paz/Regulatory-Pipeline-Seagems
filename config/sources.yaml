sources:
  - id: "iacs"
    name: "IACS"
    url: "https://www.iacs.org.uk/"
    type: "html_list"
    download: "html"

  - id: "imca"
    name: "IMCA"
    url: "https://www.imca-int.com/"
    type: "html_list"
    download: "html"

  - id: "mte"
    name: "MTE (Normas Regulamentadoras)"
    url: "https://www.gov.br/trabalho-e-emprego/pt-br/acesso-a-informacao/participacao-social/conselhos-e-orgaos-colegiados/comissao-tripartite-partitaria-permanente/normas-regulamentadoras"
    type: "html_list"
    download: "html"

  - id: "panama"
    name: "Panama Maritime Authority"
    url: "https://panamashipregistry.com/circulars/"
    type: "html_list"
    download: "pdf"
    link_pattern: "\\.pdf$"

  - id: "imodocs"
    name: "IMO IMODOCS"
    url: "https://docs.imo.org/"
    type: "login"
    download: "pdf"
    adapter: "imodocs"
    auth:
      user_env: "IMODOCS_USER"
      password_env: "IMODOCS_PASSWORD"
      login_url: "https://docs.imo.org/en/LogOn"
      search_url: "https://docs.imo.org/en/Search"
      username_selector: "#Username"
      password_selector: "#Password"
      submit_selector: "input[type=submit]"
    max_pages: 5

  - id: "dpc"
    name: "Diretoria de Portos e Costas"
    url: "https://www.marinha.mil.br/dpc/"
    type: "html_list"
    download: "pdf"